name: Atualizar vídeos do YouTube

on:
  schedule:
    - cron: '30 7 * * 0'   # domingo, 04:30 (Brasília)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install yt-dlp
      - name: Coletar vídeos e transcrições
        run: |
          python collect_videos.py
          python fetch_transcripts.py 150
          python build_videos.py
      - name: Commit se mudou
        run: |
          git config user.name "pka-bot"
          git config user.email "actions@github.com"
          git add videos_raw.json videos_selected.json transcripts site/src/data/videos.json site/src/data/video_refs.json site/src/data/transcripts.json
          if git diff --cached --quiet; then echo "Sem mudanças"; else
            git commit -m "Atualização automática de vídeos ($(date -u +%Y-%m-%d))"
            git pull --rebase
            git push
          fi
